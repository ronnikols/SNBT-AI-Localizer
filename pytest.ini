[pytest]
norecursedirs = build-dir flatpak .git __pycache__ *.egg-info *.eggs dist build venv .venv env .env .tox .nox _tox  venv* env* .pytest_cache .mypy_cache .ruff_cache .hypothesis

markers =
    unit: fast tests without GUI
    gui: slow tests requiring Qt/QApplication

# Default: run only unit tests (fast, no GUI)
testpaths = tests
addopts = -m "not gui" --ignore-glob="**/build-dir/**" --ignore-glob="**/flatpak/**" --ignore-glob="**/var/**" --ignore-glob="**/run/**"