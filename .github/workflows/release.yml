name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller pillow
      - run: pip install -r requirements.txt
      - run: pyinstaller --onefile --noconsole --icon=resources/logo.png --add-data "resources;resources" main.py --name snbt-tr
      - run: ISCC setup.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/snbt-tr.exe
            Output/snbt-tr-Windows-Installer.exe
